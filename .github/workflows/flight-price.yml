name: Pegasus Fiyat Takibi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Playwright ve Chromium kur
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Pegasus fiyatını kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > check.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const BOT_TOKEN =
            process.env.TELEGRAM_BOT_TOKEN;

          const CHAT_ID =
            process.env.TELEGRAM_CHAT_ID;

          const FLIGHT_DATE = "16 Ağustos 2026";
          const ROUTE =
            "Çukurova (COV) → Sabiha Gökçen (SAW)";
          const FLIGHT_TIME =
            "08:15 → 09:50";

          async function telegram(message) {
            if (!BOT_TOKEN || !CHAT_ID) {
              throw new Error(
                "Telegram Secret eksik."
              );
            }

            const response = await fetch(
              `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  chat_id: CHAT_ID,
                  text: message
                })
              }
            );

            const result =
              await response.json();

            console.log(
              "Telegram:",
              JSON.stringify(result)
            );

            if (!result.ok) {
              throw new Error(
                "Telegram hatası: " +
                JSON.stringify(result)
              );
            }
          }

          function normalize(text) {
            return text
              .replace(/\u00a0/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function extractPrice(text) {
            const patterns = [
              /₺\s?([\d.,]+)/gi,
              /TRY\s?([\d.,]+)/gi,
              /([\d.,]+)\s?TL/gi
            ];

            const prices = [];

            for (const pattern of patterns) {
              for (const match of text.matchAll(pattern)) {
                let value = match[1]
                  .replace(/\./g, "")
                  .replace(",", ".");

                const number =
                  parseFloat(value);

                if (
                  Number.isFinite(number) &&
                  number >= 100 &&
                  number <= 100000
                ) {
                  prices.push(number);
                }
              }
            }

            if (!prices.length) {
              return null;
            }

            return Math.min(...prices);
          }

          async function findAirport(page, text) {
            const candidates = [
              page.getByText(text, {
                exact: false
              }),
              page.locator(
                `[aria-label*="${text}" i]`
              ),
              page.locator(
                `[placeholder*="${text}" i]`
              )
            ];

            for (const locator of candidates) {
              try {
                const count =
                  await locator.count();

                if (count > 0) {
                  for (let i = 0; i < count; i++) {
                    const element =
                      locator.nth(i);

                    if (
                      await element.isVisible()
                    ) {
                      return element;
                    }
                  }
                }
              } catch {}
            }

            return null;
          }

          async function chooseAirport(
            page,
            airportText,
            code
          ) {
            const field =
              await findAirport(
                page,
                airportText
              );

            if (!field) {
              throw new Error(
                `${airportText} için alan bulunamadı.`
              );
            }

            await field.click();

            await page.waitForTimeout(1000);

            const option =
              page.getByText(
                code,
                {
                  exact: false
                }
              ).first();

            if (
              await option.count() &&
              await option.isVisible()
            ) {
              await option.click();
              return;
            }

            const airport =
              page.getByText(
                airportText,
                {
                  exact: false
                }
              ).last();

            if (
              await airport.count() &&
              await airport.isVisible()
            ) {
              await airport.click();
              return;
            }

            throw new Error(
              `${airportText} seçeneği bulunamadı.`
            );
          }

          (async () => {
            const browser =
              await chromium.launch({
                headless: true,
                args: [
                  "--no-sandbox",
                  "--disable-setuid-sandbox",
                  "--disable-dev-shm-usage",
                  "--disable-gpu"
                ]
              });

            const context =
              await browser.newContext({
                locale: "tr-TR",
                timezoneId:
                  "Europe/Istanbul",
                viewport: {
                  width: 1440,
                  height: 1200
                },
                userAgent:
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
              });

            const page =
              await context.newPage();

            try {
              console.log(
                "Pegasus sayfası açılıyor..."
              );

              await page.goto(
                "https://www.flypgs.com/sehirler/adana-istanbul-ucak-bileti",
                {
                  waitUntil:
                    "domcontentloaded",
                  timeout: 90000
                }
              );

              await page.waitForTimeout(
                10000
              );

              console.log(
                "URL:",
                page.url()
              );

              console.log(
                "TITLE:",
                await page.title()
              );

              /*
               * Sayfadaki tüm metni al.
               */
              let text =
                normalize(
                  await page
                    .locator("body")
                    .innerText()
                );

              console.log(
                "Sayfa uzunluğu:",
                text.length
              );

              /*
               * Önce doğrudan sayfada hedef
               * uçuş bilgisi var mı kontrol et.
               */
              const targetTime =
                /08[:.]15\s*[-–—]\s*09[:.]50/i
                  .test(text);

              const hasCOV =
                /COV|Çukurova/i.test(text);

              const hasSAW =
                /SAW|Sabiha Gökçen/i.test(text);

              const hasPegasus =
                /Pegasus/i.test(text);

              console.log(
                "COV:",
                hasCOV
              );

              console.log(
                "SAW:",
                hasSAW
              );

              console.log(
                "Pegasus:",
                hasPegasus
              );

              console.log(
                "08:15-09:50:",
                targetTime
              );

              /*
               * Eğer uçuş bilgisi sayfada hazırsa
               * fiyatı doğrudan ara.
               */
              if (
                hasCOV &&
                hasSAW &&
                hasPegasus
              ) {
                console.log(
                  "Pegasus sayfası doğrulandı."
                );
              }

              /*
               * Sayfadaki fiyatları ara.
               */
              let price =
                extractPrice(text);

              /*
               * Fiyat bulunamadıysa biraz daha
               * bekle ve sayfayı tekrar oku.
               */
              if (!price) {
                console.log(
                  "İlk kontrolde fiyat bulunamadı. Bekleniyor..."
                );

                await page.waitForTimeout(
                  15000
                );

                text =
                  normalize(
                    await page
                      .locator("body")
                      .innerText()
                  );

                price =
                  extractPrice(text);
              }

              /*
               * Fiyat hâlâ yoksa Telegram'a
               * açık hata bildirimi gönder.
               */
              if (!price) {
                await telegram(
                  "⚠️ PEGASUS FİYAT KONTROLÜ\n\n" +
                  `${FLIGHT_DATE}\n` +
                  `${ROUTE}\n` +
                  `${FLIGHT_TIME}\n\n` +
                  "Pegasus sayfası açıldı ancak güncel TL fiyatı alınamadı.\n\n" +
                  "Kontrol devam edecek."
                );

                return;
              }

              console.log(
                "GÜNCEL FİYAT:",
                price,
                "TL"
              );

              const file =
                "last_price.txt";

              let oldPrice = null;

              if (
                fs.existsSync(file)
              ) {
                const old =
                  fs.readFileSync(
                    file,
                    "utf8"
                  ).trim();

                const parsed =
                  parseFloat(old);

                if (
                  Number.isFinite(parsed)
                ) {
                  oldPrice = parsed;
                }
              }

              fs.writeFileSync(
                file,
                String(price)
              );

              /*
               * İlk fiyat.
               */
              if (oldPrice === null) {
                await telegram(
                  "✈️ PEGASUS FİYAT TAKİBİ BAŞLADI\n\n" +
                  `${FLIGHT_DATE}\n` +
                  `${ROUTE}\n` +
                  `${FLIGHT_TIME}\n\n` +
                  `💰 Güncel fiyat: ${price.toLocaleString("tr-TR")} TL`
                );

                return;
              }

              /*
               * Fiyat değiştiyse Telegram.
               */
              if (price !== oldPrice) {
                const difference =
                  price - oldPrice;

                const direction =
                  difference < 0
                    ? "📉 FİYAT DÜŞTÜ"
                    : "📈 FİYAT ARTTI";

                await telegram(
                  "🔔 PEGASUS FİYAT DEĞİŞTİ\n\n" +
                  `${direction}\n\n` +
                  `${FLIGHT_DATE}\n` +
                  `${ROUTE}\n` +
                  `${FLIGHT_TIME}\n\n` +
                  `Eski fiyat: ${oldPrice.toLocaleString("tr-TR")} TL\n` +
                  `Yeni fiyat: ${price.toLocaleString("tr-TR")} TL\n` +
                  `Değişim: ${difference > 0 ? "+" : ""}${difference.toLocaleString("tr-TR")} TL`
                );

                return;
              }

              console.log(
                "Fiyat değişmedi:",
                price,
                "TL"
              );

            } catch (error) {

              console.error(
                "KONTROL HATASI:",
                error
              );

              try {
                await telegram(
                  "❌ PEGASUS BOT HATASI\n\n" +
                  `${error.message}\n\n` +
                  "Kontrol devam edecek."
                );
              } catch (
                telegramError
              ) {
                console.error(
                  "Telegram hata bildirimi gönderilemedi:",
                  telegramError.message
                );
              }

              process.exitCode = 1;

            } finally {
              await browser.close();
            }
          })();
          EOF

          node check.js

      - name: Fiyatı kaydet
        if: always()
        run: |
          git config user.name "Pegasus Price Bot"
          git config user.email "actions@github.com"

          git add last_price.txt || true

          git diff --cached --quiet || \
            git commit -m "Uçuş fiyatı güncellendi"

          git push || true
