name: Pegasus Fiyat Takibi

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:

      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Playwright kur
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Pegasus fiyatını kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          cat > check.js <<'EOF'

          const { chromium } = require("playwright");
          const fs = require("fs");

          const BOT_TOKEN =
            process.env.TELEGRAM_BOT_TOKEN;

          const CHAT_ID =
            process.env.TELEGRAM_CHAT_ID;

          const DATE = "16 Ağustos 2026";
          const ROUTE =
            "Çukurova (COV) → Sabiha Gökçen (SAW)";
          const TARGET_DEPARTURE = "08:15";
          const TARGET_ARRIVAL = "09:50";

          async function telegram(message) {

            const response = await fetch(
              `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  chat_id: CHAT_ID,
                  text: message
                })
              }
            );

            const result =
              await response.json();

            console.log(
              "Telegram:",
              JSON.stringify(result)
            );

            if (!result.ok) {
              throw new Error(
                "Telegram hatası: " +
                JSON.stringify(result)
              );
            }
          }

          function normalize(text) {
            return text
              .replace(/\u00a0/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function priceToNumber(value) {

            if (!value) {
              return null;
            }

            value =
              value
                .replace(/[^\d.,]/g, "")
                .trim();

            if (!value) {
              return null;
            }

            /*
             * Türkçe fiyat:
             * 1.299,99
             */

            if (
              value.includes(".") &&
              value.includes(",")
            ) {
              value =
                value
                  .replace(/\./g, "")
                  .replace(",", ".");
            }

            /*
             * 1299,99
             */

            else if (
              value.includes(",")
            ) {
              value =
                value.replace(",", ".");
            }

            const number =
              parseFloat(value);

            if (
              !Number.isFinite(number) ||
              number < 100 ||
              number > 100000
            ) {
              return null;
            }

            return number;
          }

          function extractPrices(text) {

            const values = [];

            const patterns = [

              /₺\s*([\d.]+(?:,\d{1,2})?)/gi,

              /([\d.]+(?:,\d{1,2})?)\s*TL/gi,

              /TRY\s*([\d.]+(?:,\d{1,2})?)/gi

            ];

            for (
              const pattern of patterns
            ) {

              for (
                const match of text.matchAll(
                  pattern
                )
              ) {

                const price =
                  priceToNumber(
                    match[1]
                  );

                if (price) {
                  values.push(price);
                }
              }
            }

            return values;
          }

          async function visibleText(page) {

            return normalize(
              await page
                .locator("body")
                .innerText()
            );
          }

          async function clickSearch(page) {

            const buttons = [
              page.getByRole(
                "button",
                {
                  name:
                    /UCUZ UÇUŞ ARA/i
                }
              ),

              page.getByRole(
                "button",
                {
                  name:
                    /UÇUŞ ARA/i
                }
              ),

              page.getByText(
                "UCUZ UÇUŞ ARA",
                {
                  exact: true
                }
              ),

              page.getByText(
                "UÇUŞ ARA",
                {
                  exact: true
                }
              )
            ];

            for (
              const button of buttons
            ) {

              try {

                const count =
                  await button.count();

                for (
                  let i = 0;
                  i < count;
                  i++
                ) {

                  const item =
                    button.nth(i);

                  if (
                    await item.isVisible()
                  ) {

                    console.log(
                      "Uçuş arama butonu bulundu."
                    );

                    await item.click();

                    return true;
                  }
                }

              } catch {}

            }

            return false;
          }

          async function findVisibleInput(
            page,
            patterns
          ) {

            const inputs =
              page.locator(
                "input"
              );

            const count =
              await inputs.count();

            for (
              let i = 0;
              i < count;
              i++
            ) {

              const input =
                inputs.nth(i);

              try {

                if (
                  !(await input.isVisible())
                ) {
                  continue;
                }

                const data =
                  await input.evaluate(
                    el => ({
                      placeholder:
                        el.placeholder || "",
                      aria:
                        el.getAttribute(
                          "aria-label"
                        ) || "",
                      name:
                        el.name || "",
                      id:
                        el.id || "",
                      type:
                        el.type || ""
                    })
                  );

                const combined =
                  (
                    data.placeholder +
                    " " +
                    data.aria +
                    " " +
                    data.name +
                    " " +
                    data.id
                  ).toLowerCase();

                if (
                  patterns.some(
                    p =>
                      combined.includes(
                        p
                      )
                  )
                ) {
                  return input;
                }

              } catch {}

            }

            return null;
          }

          async function selectAirport(
            page,
            airportName,
            code,
            patterns
          ) {

            const input =
              await findVisibleInput(
                page,
                patterns
              );

            if (!input) {
              throw new Error(
                `${airportName} için görünür input bulunamadı.`
              );
            }

            await input.click();

            await input.fill(
              airportName
            );

            await page.waitForTimeout(
              1500
            );

            const options =
              page.locator(
                "text=" + code
              );

            const count =
              await options.count();

            for (
              let i = 0;
              i < count;
              i++
            ) {

              const option =
                options.nth(i);

              try {

                if (
                  await option.isVisible()
                ) {

                  await option.click();

                  console.log(
                    `${airportName} seçildi.`
                  );

                  return;
                }

              } catch {}

            }

            const namedOption =
              page.getByText(
                airportName,
                {
                  exact: false
                }
              );

            const namedCount =
              await namedOption.count();

            for (
              let i = 0;
              i < namedCount;
              i++
            ) {

              const option =
                namedOption.nth(i);

              try {

                if (
                  await option.isVisible()
                ) {

                  await option.click();

                  console.log(
                    `${airportName} seçildi.`
                  );

                  return;
                }

              } catch {}

            }

            throw new Error(
              `${airportName} seçeneği bulunamadı.`
            );
          }

          async function selectDate(page) {

            const dateInputs =
              page.locator(
                "input"
              );

            const count =
              await dateInputs.count();

            for (
              let i = 0;
              i < count;
              i++
            ) {

              const input =
                dateInputs.nth(i);

              try {

                if (
                  !(await input.isVisible())
                ) {
                  continue;
                }

                const data =
                  await input.evaluate(
                    el => ({
                      placeholder:
                        el.placeholder || "",
                      aria:
                        el.getAttribute(
                          "aria-label"
                        ) || "",
                      name:
                        el.name || "",
                      id:
                        el.id || "",
                      type:
                        el.type || ""
                    })
                  );

                const combined =
                  (
                    data.placeholder +
                    " " +
                    data.aria +
                    " " +
                    data.name +
                    " " +
                    data.id
                  ).toLowerCase();

                if (
                  /tarih|date|gidiş|departure/
                    .test(combined)
                ) {

                  await input.click();

                  await page.waitForTimeout(
                    1000
                  );

                  /*
                   * Ağustos 2026 takvimini bul.
                   */

                  const august =
                    page.getByText(
                      /Ağustos 2026/i
                    );

                  if (
                    await august.count()
                  ) {

                    console.log(
                      "Ağustos 2026 takvimi bulundu."
                    );
                  }

                  /*
                   * 16 gününü seç.
                   */

                  const day =
                    page.getByText(
                      "16",
                      {
                        exact: true
                      }
                    );

                  const dayCount =
                    await day.count();

                  for (
                    let j = 0;
                    j < dayCount;
                    j++
                  ) {

                    const item =
                      day.nth(j);

                    try {

                      if (
                        await item.isVisible()
                      ) {

                        await item.click();

                        console.log(
                          "16 Ağustos seçildi."
                        );

                        return true;
                      }

                    } catch {}

                  }
                }

              } catch {}

            }

            return false;
          }

          async function searchFlight(page) {

            console.log(
              "Uçuş arama işlemi başlıyor..."
            );

            await selectAirport(
              page,
              "Çukurova",
              "COV",
              [
                "nereden",
                "kalkış",
                "origin",
                "from"
              ]
            );

            await selectAirport(
              page,
              "Sabiha Gökçen",
              "SAW",
              [
                "nereye",
                "varış",
                "destination",
                "to"
              ]
            );

            await selectDate(
              page
            );

            await page.waitForTimeout(
              1000
            );

            const clicked =
              await clickSearch(
                page
              );

            if (!clicked) {
              throw new Error(
                "UÇUŞ ARA butonu bulunamadı."
              );
            }

            console.log(
              "Uçuş araması gönderildi."
            );

            await page.waitForTimeout(
              15000
            );

            console.log(
              "Sonuç sayfası:",
              page.url()
            );
          }

          async function findTargetFlight(
            page
          ) {

            let text =
              await visibleText(
                page
              );

            console.log(
              "Sonuç sayfası uzunluğu:",
              text.length
            );

            console.log(
              text.substring(
                0,
                20000
              )
            );

            const dep =
              text.includes(
                TARGET_DEPARTURE
              );

            const arr =
              text.includes(
                TARGET_ARRIVAL
              );

            console.log(
              "08:15:",
              dep
            );

            console.log(
              "09:50:",
              arr
            );

            if (
              !dep ||
              !arr
            ) {
              return null;
            }

            /*
             * Önce 08:15 civarındaki
             * uçuş kartını bulmaya çalış.
             */

            const locator =
              page.getByText(
                /08[:.]15/
              );

            const count =
              await locator.count();

            for (
              let i = 0;
              i < count;
              i++
            ) {

              const item =
                locator.nth(i);

              try {

                if (
                  !(await item.isVisible())
                ) {
                  continue;
                }

                const parent =
                  item.locator(
                    "xpath=ancestor::*[self::div or self::li][.//text()[contains(., '09:50')]][1]"
                  );

                if (
                  await parent.count()
                ) {

                  const cardText =
                    normalize(
                      await parent
                        .innerText()
                    );

                  console.log(
                    "HEDEF UÇUŞ KARTI:"
                  );

                  console.log(
                    cardText
                  );

                  const prices =
                    extractPrices(
                      cardText
                    );

                  if (
                    prices.length
                  ) {

                    return {
                      text: cardText,
                      price:
                        Math.min(
                          ...prices
                        )
                    };
                  }
                }

              } catch {}

            }

            /*
             * Son çare:
             * sayfadaki fiyatlardan en düşük
             * değeri al.
             */

            const prices =
              extractPrices(
                text
              );

            if (
              prices.length
            ) {

              return {
                text,
                price:
                  Math.min(
                    ...prices
                  )
              };
            }

            return null;
          }

          (async () => {

            const browser =
              await chromium.launch({
                headless: true,
                args: [
                  "--no-sandbox",
                  "--disable-setuid-sandbox",
                  "--disable-dev-shm-usage",
                  "--disable-gpu"
                ]
              });

            const context =
              await browser.newContext({
                locale: "tr-TR",
                timezoneId:
                  "Europe/Istanbul",
                viewport: {
                  width: 1440,
                  height: 1200
                }
              });

            const page =
              await context.newPage();

            try {

              console.log(
                "Pegasus açılıyor..."
              );

              await page.goto(
                "https://www.flypgs.com/sehirler/adana-istanbul-ucak-bileti",
                {
                  waitUntil:
                    "domcontentloaded",
                  timeout: 90000
                }
              );

              await page.waitForTimeout(
                10000
              );

              console.log(
                "URL:",
                page.url()
              );

              console.log(
                "TITLE:",
                await page.title()
              );

              await searchFlight(
                page
              );

              const flight =
                await findTargetFlight(
                  page
                );

              if (!flight) {

                await telegram(
                  "⚠️ PEGASUS FİYAT KONTROLÜ\n\n" +
                  `${DATE}\n` +
                  `${ROUTE}\n` +
                  `${TARGET_DEPARTURE} → ${TARGET_ARRIVAL}\n\n` +
                  "Hedef uçuş sonuçlarda bulunamadı veya fiyat alınamadı.\n\n" +
                  "Kontrol devam edecek."
                );

                return;
              }

              const price =
                flight.price;

              console.log(
                "HEDEF UÇUŞ FİYATI:",
                price,
                "TL"
              );

              const file =
                "last_price.txt";

              let oldPrice =
                null;

              if (
                fs.existsSync(file)
              ) {

                const old =
                  fs.readFileSync(
                    file,
                    "utf8"
                  ).trim();

                const parsed =
                  parseFloat(old);

                if (
                  Number.isFinite(parsed)
                ) {
                  oldPrice = parsed;
                }
              }

              fs.writeFileSync(
                file,
                String(price)
              );

              if (
                oldPrice === null
              ) {

                await telegram(
                  "✈️ PEGASUS FİYAT TAKİBİ BAŞLADI\n\n" +
                  `${DATE}\n` +
                  `${ROUTE}\n` +
                  `${TARGET_DEPARTURE} → ${TARGET_ARRIVAL}\n\n` +
                  `💰 Güncel fiyat: ${price.toLocaleString("tr-TR")} TL`
                );

                return;
              }

              if (
                price !== oldPrice
              ) {

                const difference =
                  price - oldPrice;

                const direction =
                  difference < 0
                    ? "📉 FİYAT DÜŞTÜ"
                    : "📈 FİYAT ARTTI";

                await telegram(
                  "🔔 PEGASUS FİYAT DEĞİŞTİ\n\n" +
                  `${direction}\n\n` +
                  `${DATE}\n` +
                  `${ROUTE}\n` +
                  `${TARGET_DEPARTURE} → ${TARGET_ARRIVAL}\n\n` +
                  `Eski fiyat: ${oldPrice.toLocaleString("tr-TR")} TL\n` +
                  `Yeni fiyat: ${price.toLocaleString("tr-TR")} TL\n` +
                  `Değişim: ${difference > 0 ? "+" : ""}${difference.toLocaleString("tr-TR")} TL`
                );

              } else {

                console.log(
                  "Fiyat değişmedi:",
                  price,
                  "TL"
                );

              }

            } catch (error) {

              console.error(
                "KONTROL HATASI:",
                error
              );

              try {

                await telegram(
                  "❌ PEGASUS BOT HATASI\n\n" +
                  error.message +
                  "\n\nKontrol devam edecek."
                );

              } catch (
                telegramError
              ) {

                console.error(
                  "Telegram hata bildirimi:",
                  telegramError.message
                );

              }

              process.exitCode = 1;

            } finally {

              await browser.close();

            }

          })();

          EOF

          node check.js

      - name: Fiyat dosyasını kaydet
        if: always()
        run: |
          git config user.name "Pegasus Price Bot"
          git config user.email "actions@github.com"

          git add last_price.txt || true

          git diff --cached --quiet || \
            git commit -m "Uçuş fiyatı güncellendi"

          git push || true